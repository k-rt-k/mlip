[project]
name = "mlip-playlist-project"
version = "0.1.0"
description = "Natural-language playlist recommendation baselines"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ytmusicapi==1.12.3",
    "spotipy>=2.25,<3",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["spotify/tests", "youtube_music/tests", "llm/tests", "baselines/tests"]
