AWSTemplateFormatVersion: '2010-09-09'
Description: Private CPU trial for Playlist Lab. Connect through an SSH tunnel.

Parameters:
  OperatorCidr:
    Type: String
    Description: Public IPv4 address of the SSH client, with a /32 suffix.
    AllowedPattern: '([0-9]{1,3}\.){3}[0-9]{1,3}/32'
  OperatorPublicKey:
    Type: String
    Description: Contents of the operator's OpenSSH Ed25519 public key file.
    AllowedPattern: 'ssh-ed25519 [A-Za-z0-9+/=]+( .*)?'
  TrialMinutes:
    Type: Number
    Default: 120
    MinValue: 15
    MaxValue: 1440
  UbuntuAmi:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/canonical/ubuntu/server/noble/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  TrialVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.75.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true

  TrialSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TrialVpc
      CidrBlock: 10.75.0.0/26

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref TrialVpc
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TrialVpc

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref TrialSubnet

  SshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from the Playlist Lab operator
      VpcId: !Ref TrialVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref OperatorCidr

  OperatorKey:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub '${AWS::StackName}-operator'
      KeyType: ed25519
      PublicKeyMaterial: !Ref OperatorPublicKey

  TrialInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - InternetRoute
      - SubnetRouteTable
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: m7i.xlarge
      InstanceInitiatedShutdownBehavior: stop
      KeyName: !Ref OperatorKey
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref TrialSubnet
          GroupSet:
            - !Ref SshSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 40
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eu
          deadline=$(date -u -d '+${TrialMinutes} minutes' '+%Y-%m-%d %H:%M:%S UTC')
          cat >/etc/systemd/system/playlist-lab-trial-stop.service <<'EOF'
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/systemctl --no-block poweroff
          EOF
          cat >/etc/systemd/system/playlist-lab-trial-stop.timer <<EOF
          [Timer]
          OnCalendar=$deadline
          AccuracySec=1s
          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable --now playlist-lab-trial-stop.timer
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: Project
          Value: PlaylistLab

Outputs:
  InstanceId:
    Value: !Ref TrialInstance
  InitialPublicIp:
    Value: !GetAtt TrialInstance.PublicIp
